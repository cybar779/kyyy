<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Akun — KyyyMods</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app-shell" id="shell"></div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      const user = await requireSession();
      if (!user) return;

      document.getElementById('shell').innerHTML = `
        ${renderSidebar()}
        <main class="main">
          <div class="page-header"><h1 class="page-title">Akun</h1></div>
          <div class="panel" style="max-width:480px;">
            <div class="panel-title" style="margin-bottom:18px;">Informasi Akun</div>
            <div style="display:flex; flex-direction:column; gap:16px;">
              <div>
                <label>Username</label>
                <div style="font-weight:700; font-size:16px;">${escapeHtml(user.username)}</div>
              </div>
              <div>
                <label>Peran</label>
                <span class="badge ${user.role === 'admin' ? 'badge-violet' : 'badge-amber'}">${user.role === 'admin' ? 'Administrator' : 'User Biasa'}</span>
              </div>
              ${user.role !== 'admin' ? `
              <div>
                <label>Sisa Credit</label>
                <div style="font-weight:700; font-size:16px; color:var(--violet);">${user.credits ?? 0}</div>
              </div>` : ''}
            </div>
          </div>
        </main>
      `;
      initSidebar(user.role);
    })();
  </script>
</body>
</html>
